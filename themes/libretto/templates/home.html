{% extends "base.html" %}

{% block title %}{{ SITENAME }} - {{ page.title }}{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/libretto/css/profile.css">

<h1>{{ page.title }}</h1>
<div class="profile-section">
    {% if PROFILE_IMAGE %}
    <img class="profile-photo"
         src="{{ SITEURL }}/images/{{ PROFILE_IMAGE }}"
         alt="{{ AUTHOR }}">
    {% endif %}
    <div class="profile-bio">
        {{ page.content }}
    </div>
</div>
{% endblock %}
